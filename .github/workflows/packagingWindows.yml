name: Packaging for Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Advanced Installer
        uses: caphyon/advinst-github-action@v1.0
        with:
          advinst-version: '20.9.1'
          advinst-enable-automation: 'true'

      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@master
        with:
          packages: cmake mingw64-x86_64-clang zip unzip wget curl make git libtool libSDL2-devel

      - name: Create package
        run: bash ./buildWindows.sh

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Picto-Windows
          path: build/installer/*.msi

      - name: Move the latest-windows tag to this commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          git tag -f latest-windows
          git push -f origin latest-windows

      - name: Publish the rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Picto for Windows (development build)
          prerelease: true
          files: build/installer/*.msi
